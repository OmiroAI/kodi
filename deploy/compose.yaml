services:
  dashboard:
    image: ghcr.io/kdlbs/kandev:0.97.0@sha256:f9f489da26cb3156c33a5679ca76b975502abfc78f516a659434d340361de6f4
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:38429:38429"
    volumes:
      - dashboard-data:/data
    environment:
      KANDEV_DOCKER_ENABLED: "false"
      KANDEV_LOG_LEVEL: warn
    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:38429/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  access:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP}:8443:8443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${SECRET_DIR}/dashboard.htpasswd:/run/secrets/dashboard.htpasswd:ro
      - ${TLS_DIR}:/run/tls:ro
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    depends_on: [dashboard, setup]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  setup:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    restart: unless-stopped
    user: "1000:1000"
    command: [python, /app/github_setup.py]
    environment:
      PUBLIC_URL: "https://${PUBLIC_HOST}:8443"
      GITHUB_ORG: "${GITHUB_ORG:?Set GITHUB_ORG in the private environment file}"
      KODI_SETUP_REPOSITORY: "${KODI_SETUP_REPOSITORY:-dev-system}"
      HOST_PRIVATE_KEY_PATH: "${SECRET_DIR}/github/github-app.pem"
    volumes:
      - ../scripts/github_setup.py:/app/github_setup.py:ro
      - ${SECRET_DIR}/github:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.2
    mem_limit: 64m
    pids_limit: 32
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
volumes:
  dashboard-data:
