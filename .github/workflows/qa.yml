name: QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: system-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public-source privacy boundary
        run: python3 scripts/check_public_source.py
      - name: Check syntax
        run: python3 -m compileall -q kodi scripts
      - name: Verify acceptance and sandbox boundaries
        run: python3 -m unittest discover -s tests -v
